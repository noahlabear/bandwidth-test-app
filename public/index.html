<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bandwidth Test — codeship.site</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050a0a;
      color: #e2e8e8;
      font-family: 'Segoe UI', system-ui, sans-serif;
      gap: 2rem;
      padding: 2rem;
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 1rem;
      padding: 2.5rem 3rem;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .subtitle {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      line-height: 1.5;
      margin-top: -1rem;
    }

    /* ── Gauge ── */
    .gauge-row {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
    }
    .gauge-val {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      transition: color 0.4s;
      color: #10b981; /* emerald */
    }
    .gauge-val.warn  { color: #f59e0b; }
    .gauge-val.alert { color: #ef4444; }
    .gauge-unit {
      font-size: 1rem;
      color: rgba(255,255,255,0.4);
    }

    /* ── Progress bar ── */
    .bar-track {
      height: 8px;
      border-radius: 99px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: #10b981;
      transition: width 0.5s ease, background 0.4s;
      width: 0%;
    }
    .bar-fill.warn  { background: #f59e0b; }
    .bar-fill.alert { background: #ef4444; }

    .bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      margin-top: 0.25rem;
    }

    /* ── Stats row ── */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .stat {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 0.6rem;
      padding: 0.75rem 1rem;
    }
    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.35);
    }
    .stat-value {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 0.15rem;
      color: #fff;
    }

    /* ── Button ── */
    .btn {
      cursor: pointer;
      border: none;
      border-radius: 0.6rem;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #000;
      background: #10b981;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 0 0 0 rgba(16,185,129,0);
    }
    .btn:hover {
      background: #34d399;
      box-shadow: 0 0 20px rgba(16,185,129,0.4);
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled {
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.3);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ── Notification banner ── */
    .banner {
      display: none;
      border-radius: 0.6rem;
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      line-height: 1.5;
      border: 1px solid;
    }
    .banner.warn {
      display: block;
      background: rgba(245,158,11,0.1);
      border-color: rgba(245,158,11,0.3);
      color: #fbbf24;
    }
    .banner.alert {
      display: block;
      background: rgba(239,68,68,0.1);
      border-color: rgba(239,68,68,0.3);
      color: #f87171;
    }

    /* ── Stream list ── */
    .stream-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      max-height: 140px;
      overflow-y: auto;
    }
    .stream-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(16,185,129,0.06);
      border: 1px solid rgba(16,185,129,0.15);
      border-radius: 0.4rem;
      padding: 0.4rem 0.75rem;
      font-size: 0.75rem;
    }
    .stream-item .s-label { color: rgba(255,255,255,0.6); }
    .stream-item .s-timer { color: #10b981; font-variant-numeric: tabular-nums; }
    .stream-item.done {
      border-color: rgba(255,255,255,0.06);
      background: transparent;
      opacity: 0.4;
    }
    .stream-item.done .s-timer { color: rgba(255,255,255,0.3); }
  </style>
</head>
<body>

<div class="card">
  <div>
    <h1>Bandwidth Test App</h1>
    <p class="subtitle">
      Each button press opens a 60-second 1&nbsp;Mbps egress stream.<br>
      Prometheus picks up the rate within ~5&nbsp;min → dashboard notification fires at 4&nbsp;Mbps.
    </p>
  </div>

  <!-- Gauge -->
  <div>
    <div class="gauge-row">
      <span class="gauge-val" id="gauge">0.0</span>
      <span class="gauge-unit">Mbps egress</span>
    </div>
    <div style="margin-top:0.75rem;">
      <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
      <div class="bar-labels">
        <span>0</span>
        <span>4 Mbps — notify</span>
        <span>5 Mbps — cap</span>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat">
      <div class="stat-label">Active streams</div>
      <div class="stat-value" id="stat-streams">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Cap remaining</div>
      <div class="stat-value" id="stat-remaining">5.0 Mbps</div>
    </div>
  </div>

  <!-- Banner -->
  <div class="banner" id="banner"></div>

  <!-- Button -->
  <button class="btn" id="btn" onclick="addStream()">+ 1 Mbps</button>

  <!-- Active stream list -->
  <div class="stream-list" id="stream-list"></div>
</div>

<script>
  // Track streams: { id, startedAt, endsAt, done }
  const streams = [];
  let nextId = 1;

  function addStream() {
    const id = nextId++;
    const startedAt = Date.now();
    const endsAt = startedAt + 60_000;
    streams.push({ id, startedAt, endsAt, done: false });

    // Render item immediately
    renderStreamItem(id);

    // Fire the actual HTTP stream in the background — browser drains body
    // which forces the server to keep writing, generating real pod egress.
    fetch('/stream')
      .then(res => {
        // Drain the response body so the server keeps sending
        const reader = res.body.getReader();
        const drain = () => reader.read().then(({ done }) => { if (!done) drain(); });
        drain();
      })
      .catch(() => {})
      .finally(() => {
        const s = streams.find(x => x.id === id);
        if (s) s.done = true;
      });
  }

  function renderStreamItem(id) {
    const list = document.getElementById('stream-list');
    const el = document.createElement('li');
    el.id = `stream-${id}`;
    el.className = 'stream-item';
    el.innerHTML = `
      <span class="s-label">Stream #${id} — 1 Mbps</span>
      <span class="s-timer" id="timer-${id}">60s</span>
    `;
    list.prepend(el);
  }

  function tick() {
    const now = Date.now();
    let activeMbps = 0;

    for (const s of streams) {
      const remaining = Math.max(0, Math.ceil((s.endsAt - now) / 1000));
      const el = document.getElementById(`stream-${s.id}`);
      const timer = document.getElementById(`timer-${s.id}`);

      if (remaining === 0 || s.done) {
        s.done = true;
        if (el && !el.classList.contains('done')) el.classList.add('done');
        if (timer) timer.textContent = 'done';
      } else {
        activeMbps += 1;
        if (timer) timer.textContent = `${remaining}s`;
      }
    }

    // Update gauge
    const gauge = document.getElementById('gauge');
    const bar   = document.getElementById('bar');
    gauge.textContent = activeMbps.toFixed(1);

    const pct = Math.min(100, (activeMbps / 5) * 100);
    bar.style.width = pct + '%';

    // Colour coding
    const warn  = activeMbps >= 4;
    const alert = activeMbps >= 5;
    gauge.className = 'gauge-val' + (alert ? ' alert' : warn ? ' warn' : '');
    bar.className   = 'bar-fill'  + (alert ? ' alert' : warn ? ' warn' : '');

    // Stats
    document.getElementById('stat-streams').textContent = activeMbps;
    const remaining = Math.max(0, 5 - activeMbps);
    document.getElementById('stat-remaining').textContent = remaining.toFixed(1) + ' Mbps';

    // Banner
    const banner = document.getElementById('banner');
    if (alert) {
      banner.className = 'banner alert';
      banner.textContent = '⚠ At or above the 5 Mbps cap — traffic is being throttled by the CNI plugin.';
    } else if (warn) {
      banner.className = 'banner warn';
      banner.textContent = '⚡ Above 4 Mbps threshold — a dashboard notification will appear within ~5 minutes.';
    } else {
      banner.className = 'banner';
      banner.textContent = '';
    }

    // Disable button at cap
    document.getElementById('btn').disabled = activeMbps >= 5;
  }

  setInterval(tick, 500);
  tick();
</script>
</body>
</html>
